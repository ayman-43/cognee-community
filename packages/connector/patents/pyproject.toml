[project]
name = "cognee-community-connector-patents"
version = "0.1.0"
description = "Patent data-source connector for cognee — watch patent searches on EPO Open Patent Services (worldwide coverage) and sync new publications into memory, with forget-on-scope-change"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires cognee's per-row node sets (DOCUMENT_SYNC_VERSION >= 2, the
    # cognee_node_set column), which landed in 1.6.3 and was hardened in 1.6.4.
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # httpx is already a cognee dependency; it is listed because this package
    # imports it directly (the OPS client is plain httpx, no extra SDK).
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_patents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
