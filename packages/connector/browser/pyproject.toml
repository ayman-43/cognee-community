[project]
name = "cognee-community-connector-browser"
version = "0.1.0"
description = "Browser history & bookmarks data-source connector for cognee — sync Chrome, Edge, Brave, Vivaldi and Firefox history into memory with privacy defaults, incrementally and with forget-on-delete"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires cognee's per-row node sets (DOCUMENT_SYNC_VERSION >= 2, the
    # cognee_node_set column), which landed in 1.6.3 and was hardened in 1.6.4.
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # httpx is already a cognee dependency; listed because the optional page
    # fetch imports it directly.
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_browser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
